name: Generated animations (Mode B render)

# Manual only. Renders a topic from generated_animations/scenes/<topic> with the repo's Piper voice and
# synthesized music, and uploads the mp4 as a workflow artifact. Never uploads to YouTube.
on:
  workflow_dispatch:
    inputs:
      topic:
        description: Topic id under generated_animations/scenes/
        default: gps_how_it_works
      allow_unapproved:
        description: Render code that has not been approved yet (demo / Mode A review)
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      VOICES_DIR: ${{ github.workspace }}/.cache/voices
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: shorts/requirements.txt
      - name: System packages
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q ffmpeg fonts-noto-core libcairo2-dev libpango1.0-dev pkg-config python3-dev
      - name: Cache Piper voices
        uses: actions/cache@v4
        with:
          path: .cache/voices
          key: piper-hi_IN-pratham-medium
      - run: pip install -r shorts/requirements.txt "manim==0.22.1" pytest edge-tts
      - name: Tests
        run: python -m pytest tests/generated_animations -q
      - name: Safety scan
        run: python -m generated_animations scan "${{ inputs.topic }}"
      - name: Render (voices come from the topic's animation_config.json; no fallback)
        run: |
          FLAG=""
          if [ "${{ inputs.allow_unapproved }}" = "true" ]; then FLAG="--no-approval"; fi
          python -m generated_animations render "${{ inputs.topic }}" --out output_generated $FLAG
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.topic }}
          path: |
            output_generated/${{ inputs.topic }}.mp4
            output_generated/render_report.json
      - name: Publish the render to an output branch (so it can be fetched with git)
        run: |
          mkdir -p /tmp/out && cp output_generated/${{ inputs.topic }}.mp4 output_generated/render_report.json /tmp/out/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan generated-animations-output
          git rm -rf -q . || true
          cp /tmp/out/* .
          git add ${{ inputs.topic }}.mp4 render_report.json
          git commit -q -m "Render of ${{ inputs.topic }}"
          git push -f origin generated-animations-output
