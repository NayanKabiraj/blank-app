name: Upload queued videos

# Videos that YouTube refused (the channel's daily upload limit) wait in videos/unpublished/. This uploads them as soon as YouTube
# accepts uploads again, without a render, three tries a day. It also deletes the videos of earlier days (shorts.cleanup, KEEP_DAYS),
# so that only one job ever deletes files in the repository.
on:
  schedule:
    - cron: "40 8 * * *"
    - cron: "40 14 * * *"
    - cron: "40 20 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: shorts-pipeline
  cancel-in-progress: false

jobs:
  flush:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
      YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
      YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
      YT_REFRESH_TOKEN_HI: ${{ secrets.YT_REFRESH_TOKEN_HI }}
      YT_PRIVACY: ${{ vars.YT_PRIVACY || 'private' }}
      YT_AI_DISCLOSURE: ${{ vars.YT_AI_DISCLOSURE || 'off' }}
      KEEP_DAYS: ${{ vars.KEEP_DAYS || '1' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: shorts/requirements.txt
      - run: pip install -q -r shorts/requirements.txt
      - name: Upload the queue (oldest first, stops at the limit)
        run: |
          if ls videos/unpublished/*/meta.json >/dev/null 2>&1; then
            python -m shorts.pending list
            python -m shorts.pending flush || true
          else
            echo "Nothing is queued."
          fi
      - name: Remove the videos of earlier days
        run: python -m shorts.cleanup
      - name: Save the result
        if: always()
        run: |
          if [ -n "$(git status --porcelain data/ videos/)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/ videos/
            git commit -m "chore: upload queued videos, remove old ones [skip ci]"
            for i in 1 2 3 4 5 6; do
              git pull --rebase -q && git push && break
              echo "push attempt $i failed, retrying"; git rebase --abort 2>/dev/null || true; sleep $((i * 7))
            done
          fi
