name: Upload queued videos

# Videos that YouTube refused (daily upload limit, quota) wait in videos/unpublished/. This uploads them as soon as the limit
# has reset, without a render: three tries a day, after the YouTube API quota resets at midnight Pacific time (08:00 UTC in
# winter, 07:00 UTC in summer). Each upload costs 1,600 of the 10,000 daily API quota units, so about six uploads fit in a day.
on:
  schedule:
    - cron: "40 8 * * *"
    - cron: "40 14 * * *"
    - cron: "40 20 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: shorts-pipeline
  cancel-in-progress: false

jobs:
  flush:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
      YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
      YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
      YT_REFRESH_TOKEN_HI: ${{ secrets.YT_REFRESH_TOKEN_HI }}
      YT_PRIVACY: ${{ vars.YT_PRIVACY || 'private' }}
      YT_AI_DISCLOSURE: ${{ vars.YT_AI_DISCLOSURE || 'off' }}
    steps:
      - uses: actions/checkout@v4
      - name: Anything waiting?
        id: q
        run: |
          if ls videos/unpublished/*/meta.json >/dev/null 2>&1; then echo "any=true" >> "$GITHUB_OUTPUT"; else echo "Nothing is queued."; fi
      - uses: actions/setup-python@v5
        if: steps.q.outputs.any == 'true'
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: shorts/requirements.txt
      - name: Upload the queue (oldest first, stops at the daily limit)
        if: steps.q.outputs.any == 'true'
        run: |
          pip install -q -r shorts/requirements.txt
          python -m shorts.pending list
          python -m shorts.pending flush || true
      - name: Save the result
        if: steps.q.outputs.any == 'true' && always()
        run: |
          if [ -n "$(git status --porcelain data/ videos/)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/ videos/
            git commit -m "chore: upload queued videos [skip ci]"
            for i in 1 2 3 4 5 6; do
              git pull --rebase -q && git push && break
              echo "push attempt $i failed, retrying"; git rebase --abort 2>/dev/null || true; sleep $((i * 7))
            done
          fi
