name: Channel trends

# The daily task starts with a channel check (python -m shorts.channel_trends summary). This refreshes data/channel_trends.json from the YouTube
# Data + Analytics APIs shortly before the daily task runs. If the sign-in lacks the read-only scopes it records why instead of failing.
on:
  schedule:
    - cron: "15 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: channel-trends
  cancel-in-progress: false

jobs:
  trends:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
      YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
      YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: shorts/requirements.txt
      - run: pip install -q -r shorts/requirements.txt
      - name: Fetch the channel numbers
        run: python -m shorts.channel_trends fetch
      - name: Save
        run: |
          if [ -n "$(git status --porcelain data/)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/channel_trends.json
            git commit -m "chore: channel trends [skip ci]"
            for i in 1 2 3 4 5 6; do
              git pull --rebase -q && git push && break
              echo "push attempt $i failed, retrying"; git rebase --abort 2>/dev/null || true; sleep $((i * 7))
            done
          fi
