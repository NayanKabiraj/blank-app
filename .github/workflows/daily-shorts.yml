name: Daily YouTube Shorts

# Triggered every day by a scheduled Claude task, which does the niche research and writes
# the scripts, then calls this workflow with the plan. This job only renders and uploads.
on:
  workflow_dispatch:
    inputs:
      plan_json:
        description: "Video plan JSON (schema: python -m shorts.plan schema). Empty = sample plan"
        type: string
        default: ""
      dry_run:
        description: "Render only, do not upload"
        type: boolean
        default: false
      visual_style:
        description: "Visuals: cartoon3d (3D cartoon), motion (Manim graphics) or footage (stock video). Empty = repo default"
        type: string
        default: ""
      langs:
        description: "Languages to produce"
        type: string
        default: "en,hi"

permissions:
  contents: write   # to commit data/history.json (topic memory)

concurrency:
  group: daily-shorts
  cancel-in-progress: false

jobs:
  make-shorts:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
      YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
      YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
      YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
      YT_REFRESH_TOKEN_HI: ${{ secrets.YT_REFRESH_TOKEN_HI }}
      # Optional repository variables (Settings > Secrets and variables > Actions > Variables)
      YT_PRIVACY: ${{ vars.YT_PRIVACY || 'public' }}
      PIPER_VOICE_EN: ${{ vars.PIPER_VOICE_EN || 'en_US-lessac-medium' }}
      PIPER_VOICE_HI: ${{ vars.PIPER_VOICE_HI || 'hi_IN-pratham-medium' }}
      VOICES_DIR: ${{ github.workspace }}/.cache/voices
      WIKIMEDIA_CONTACT: ${{ vars.WIKIMEDIA_CONTACT }}
      # motion = Manim motion graphics (default), footage = real stock footage
      VISUAL_STYLE: ${{ inputs.visual_style || vars.VISUAL_STYLE || 'cartoon3d' }}
      # Free AI clips for scenes with an ai_prompt (see shorts/ai_video.py). All optional:
      # HF_TOKEN = your free Hugging Face account's GPU quota for Wan 2.2 / LTX-Video Spaces;
      # POLLINATIONS_KEY = higher image limits (and paid video models if you enable them).
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      POLLINATIONS_KEY: ${{ secrets.POLLINATIONS_KEY }}
      AI_VIDEO: ${{ vars.AI_VIDEO || 'on' }}
      AI_VIDEO_PROVIDERS: ${{ vars.AI_VIDEO_PROVIDERS || 'wan,ltx,image' }}
      AI_VIDEO_MAX_CLIPS: ${{ vars.AI_VIDEO_MAX_CLIPS || '2' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: shorts/requirements.txt

      - name: Install FFmpeg and fonts (English + Devanagari)
        run: |
          sudo apt-get update -q
          # libpango1.0-dev + pkg-config: needed to build manimpango (Manim's text renderer)
          sudo apt-get install -y -q ffmpeg fonts-noto-core fonts-noto-ui-core libpango1.0-dev pkg-config
          fc-list | grep -i -E "NotoSans(Devanagari)?-" | head -5

      - name: Cache Piper voices
        uses: actions/cache@v4
        with:
          path: .cache/voices
          key: piper-${{ env.PIPER_VOICE_EN }}-${{ env.PIPER_VOICE_HI }}

      - name: Install Python packages
        run: pip install -r shorts/requirements.txt

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: shorts/cartoon3d/package-lock.json

      - name: Install the 3D cartoon renderer (Playwright + Chromium)
        working-directory: shorts/cartoon3d
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: Read the plan sent by Claude
        env:
          IN_PLAN: ${{ inputs.plan_json }}
        run: |
          if [ -n "$IN_PLAN" ]; then
            printf '%s' "$IN_PLAN" > "$RUNNER_TEMP/plan.json"
          else
            echo "::warning::No plan_json given, using shorts/sample_plan.json"
            cp shorts/sample_plan.json "$RUNNER_TEMP/plan.json"
          fi
          python -m shorts.plan validate "$RUNNER_TEMP/plan.json" || echo "::warning::Plan has warnings (see above)"

      - name: Render and publish
        env:
          IN_LANGS: ${{ inputs.langs || 'en,hi' }}
          IN_DRY_RUN: ${{ inputs.dry_run }}
        run: |
          ARGS=(--plan-file "$RUNNER_TEMP/plan.json" --langs "$IN_LANGS")
          if [ "$IN_DRY_RUN" = "true" ]; then ARGS+=(--dry-run); fi
          python -m shorts.main "${ARGS[@]}"

      - name: Keep videos as a workflow artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shorts-${{ github.run_number }}
          path: |
            output/*.mp4
            output/plan.json
          retention-days: 14
          if-no-files-found: ignore

      - name: Save topic history and videos
        if: always()
        run: |
          if [ -n "$(git status --porcelain data/ videos/)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/ videos/
            git commit -m "chore: save today's Shorts [skip ci]"
            git pull --rebase -q
            git push
          fi
