name: Daily YouTube Shorts

# Triggered every day by a scheduled Claude task, which does the niche research and writes
# the scripts, then calls this workflow with the plan. This job only renders and uploads.
on:
  workflow_dispatch:
    inputs:
      plan_json:
        description: "Video plan JSON (schema: python -m shorts.plan schema). Empty = sample plan"
        type: string
        default: ""
      dry_run:
        description: "Render only, do not upload"
        type: boolean
        default: false
      langs:
        description: "Languages to produce"
        type: string
        default: "en,hi"

permissions:
  contents: write   # to commit data/history.json (topic memory)

concurrency:
  group: daily-shorts
  cancel-in-progress: false

jobs:
  make-shorts:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
      YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
      YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
      YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
      YT_REFRESH_TOKEN_HI: ${{ secrets.YT_REFRESH_TOKEN_HI }}
      # Optional repository variables (Settings > Secrets and variables > Actions > Variables)
      YT_PRIVACY: ${{ vars.YT_PRIVACY || 'public' }}
      PIPER_VOICE_EN: ${{ vars.PIPER_VOICE_EN || 'en_US-lessac-medium' }}
      PIPER_VOICE_HI: ${{ vars.PIPER_VOICE_HI || 'hi_IN-pratham-medium' }}
      VOICES_DIR: ${{ github.workspace }}/.cache/voices
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: shorts/requirements.txt

      - name: Install FFmpeg and fonts (English + Devanagari)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q ffmpeg fonts-noto-core fonts-noto-ui-core
          fc-list | grep -i -E "NotoSans(Devanagari)?-" | head -5

      - name: Cache Piper voices
        uses: actions/cache@v4
        with:
          path: .cache/voices
          key: piper-${{ env.PIPER_VOICE_EN }}-${{ env.PIPER_VOICE_HI }}

      - name: Install Python packages
        run: pip install -r shorts/requirements.txt

      - name: Read the plan sent by Claude
        env:
          IN_PLAN: ${{ inputs.plan_json }}
        run: |
          if [ -n "$IN_PLAN" ]; then
            printf '%s' "$IN_PLAN" > "$RUNNER_TEMP/plan.json"
          else
            echo "::warning::No plan_json given, using shorts/sample_plan.json"
            cp shorts/sample_plan.json "$RUNNER_TEMP/plan.json"
          fi
          python -m shorts.plan validate "$RUNNER_TEMP/plan.json" || echo "::warning::Plan has warnings (see above)"

      - name: Render and publish
        env:
          IN_LANGS: ${{ inputs.langs || 'en,hi' }}
          IN_DRY_RUN: ${{ inputs.dry_run }}
        run: |
          ARGS=(--plan-file "$RUNNER_TEMP/plan.json" --langs "$IN_LANGS")
          if [ "$IN_DRY_RUN" = "true" ]; then ARGS+=(--dry-run); fi
          python -m shorts.main "${ARGS[@]}"

      - name: Keep videos as a workflow artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shorts-${{ github.run_number }}
          path: |
            output/*.mp4
            output/plan.json
          retention-days: 14
          if-no-files-found: ignore

      - name: Save topic history
        if: always()
        run: |
          if [ -n "$(git status --porcelain data/)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/
            git commit -m "chore: log today's Shorts [skip ci]"
            git pull --rebase -q
            git push
          fi
