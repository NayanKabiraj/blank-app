name: Daily YouTube Shorts

# Triggered every day by a scheduled Claude task, which does the niche research and writes
# the scripts, then calls this workflow with the plan. This job only renders and uploads.
on:
  workflow_dispatch:
    inputs:
      format:
        description: "cinematic (premium motion-graphics Short - deep navy/black, glow, particles, camera drift, FFmpeg crossfades; same plan schema as shorts; renders only, never uploads), shorts (the daily 45-55 second whiteboard Shorts), documentary (5-15 minute whiteboard videos; plan schema: python -m shorts.plan doc-schema), director (Claude-directed dynamic Three.js Short from a manifest in manifest_json), director-documentary (the same, 5-10 minute landscape), stockreel (real Wikimedia Commons stock-footage Short, Ken Burns pan/zoom, from the same plan schema as shorts; no API key needed), stockreel-documentary (the same, long-form), voicelab (voice samples, no video), ytauth (one-time YouTube sign-in) or upload (upload an already saved day to YouTube, or just check the credentials with dry_run)"
        type: string
        default: "shorts"
      auth_code:
        description: "format ytauth only: empty = print the Google sign-in link; otherwise the address the browser shows after approving (http://localhost/?code=...)"
        type: string
        default: ""
      upload_date:
        description: "format upload only: the day to upload, e.g. 2026-11-16 (videos/<date>/ and data/plans/<date>.json must exist). Empty (and dry_run off) = upload the videos waiting in videos/unpublished/"
        type: string
        default: ""
      keep_in_repo:
        description: "documentary only: also commit the videos to videos/<date>/ (they are large; normally they are only kept as workflow artifacts)"
        type: boolean
        default: false
      plan_json:
        description: "Video plan JSON (schema: python -m shorts.plan schema). Empty = sample plan"
        type: string
        default: ""
      manifest_json:
        description: "format director / director-documentary only: the video manifest JSON written by Claude (see shorts/CLAUDE_DIRECTOR_TASK.md). Empty = the example manifest"
        type: string
        default: ""
      dry_run:
        description: "Render only, do not upload"
        type: boolean
        default: false
      langs:
        description: "Languages to produce"
        type: string
        default: "en,hi"

permissions:
  contents: write   # to commit data/history.json (topic memory)

concurrency:
  # a documentary (hours of rendering) must not block, or cancel, the Shorts that are started next to it
  group: ${{ (inputs.format == 'documentary' || inputs.format == 'director-documentary' || inputs.format == 'stockreel-documentary') && 'documentary' || 'shorts-pipeline' }}
  cancel-in-progress: false

jobs:
  # director videos render one language per runner, in parallel (a documentary takes about an hour per language);
  # every other format keeps rendering all its languages in one job
  plan:
    runs-on: ubuntu-latest
    outputs:
      langs: ${{ steps.m.outputs.langs }}
    steps:
      - id: m
        env:
          IN_FORMAT: ${{ inputs.format }}
          IN_LANGS: ${{ inputs.langs || 'en,hi' }}
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os
          langs = [x.strip() for x in os.environ["IN_LANGS"].split(",") if x.strip()]
          split = os.environ["IN_FORMAT"].startswith("director")
          print("langs=" + json.dumps(langs if split else [",".join(langs)]))
          PY

  make-shorts:
    needs: plan
    strategy:
      fail-fast: false
      matrix:
        langs: ${{ fromJSON(needs.plan.outputs.langs) }}
    runs-on: ubuntu-latest
    timeout-minutes: 360   # a documentary (and Parler-TTS voices on the CPU) takes far longer than a Short
    env:
      YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
      YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
      YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
      YT_REFRESH_TOKEN_HI: ${{ secrets.YT_REFRESH_TOKEN_HI }}
      # Optional repository variables (Settings > Secrets and variables > Actions > Variables)
      YT_PRIVACY: ${{ vars.YT_PRIVACY || 'private' }}
      # YouTube's "altered or synthetic content" label: off unless the YT_AI_DISCLOSURE variable is "on"
      YT_AI_DISCLOSURE: ${{ vars.YT_AI_DISCLOSURE || 'off' }}
      PIPER_VOICE_EN: ${{ vars.PIPER_VOICE_EN || 'en_US-ryan-high' }}
      PIPER_VOICE_HI: ${{ vars.PIPER_VOICE_HI || 'hi_IN-pratham-medium' }}
      VOICES_DIR: ${{ github.workspace }}/.cache/voices
      HF_HOME: ${{ github.workspace }}/.cache/hf
      # The Indic Parler-TTS model is gated: a free Hugging Face read token (from an account that accepted the
      # model's terms) as the HF_TOKEN repository secret turns the Parler voices on. Without it Piper is used.
      # stockreel also tries this same token for Hugging Face's free Inference API (an AI image per scene), after
      # Pollinations and before the real Wikimedia photo - see shorts/stockreel/aiframes.py.
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      POLLINATIONS_API_KEY: ${{ secrets.POLLINATIONS_KEY || secrets.POLLINATIONS_API_KEY }}   # stockreel, optional: a free key from enter.pollinations.ai (repo secret is named POLLINATIONS_KEY)
      # stockreel, optional: a free key from aistudio.google.com/apikey - tried before Pollinations/Hugging
      # Face and skipped for the rest of the run if it answers with a quota error (shorts/stockreel/aiframes.py)
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      # stockreel, optional: "local" runs a small diffusion model (stabilityai/sd-turbo) on the runner's own CPU
      # instead of (or after) an API - no key needed, but slow; installed only when this is set to "local"
      # Repo variable is named IMAGEENGINE (no underscore - GitHub Actions variable names in this repo can't
      # take one); the internal flag/env var stays IMAGE_ENGINE, read as os.environ.get("IMAGE_ENGINE").
      IMAGE_ENGINE: ${{ vars.IMAGEENGINE || '' }}
      # voice engine: piper (default, fast) or parler (Indic Parler-TTS, Rohit / Thoma, slow); set the TTS_ENGINE variable
      TTS_ENGINE: ${{ vars.TTS_ENGINE || 'piper' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: shorts/requirements.txt

      - name: Install FFmpeg and fonts (English + Devanagari)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q ffmpeg fonts-noto-core fonts-noto-ui-core
          fc-list | grep -i -E "NotoSans(Devanagari)?-" | head -5

      - name: Cache Piper voices
        uses: actions/cache@v4
        with:
          path: .cache/voices
          key: piper-${{ env.PIPER_VOICE_EN }}-${{ env.PIPER_VOICE_HI }}

      - name: Cache the Parler-TTS model
        if: ${{ vars.TTS_ENGINE == 'parler' && inputs.format != 'upload' && inputs.format != 'ytauth' }}
        uses: actions/cache@v4
        with:
          path: .cache/hf
          key: parler-indic-v1

      - name: Cache the local image model
        if: ${{ vars.IMAGEENGINE == 'local' && startsWith(inputs.format, 'stockreel') }}
        uses: actions/cache@v4
        with:
          path: .cache/hf
          key: sd-turbo-v1

      - name: Install Python packages
        run: pip install -r shorts/requirements.txt

      - name: Install Parler-TTS (optional, without it the Piper voice is used)
        if: ${{ vars.TTS_ENGINE == 'parler' && inputs.format != 'upload' && inputs.format != 'ytauth' }}
        run: |
          pip install torch torchaudio --index-url https://download.pytorch.org/whl/cpu \
            && pip install git+https://github.com/huggingface/parler-tts.git \
            && pip install -U "protobuf>=7.36.1" \
            && python -c "from sentencepiece import sentencepiece_model_pb2" \
            || echo "::warning::Parler-TTS could not be installed, the Piper voice will be used"

      - name: Install a local image model (stockreel, optional - repo variable IMAGEENGINE=local; without it Pollinations/Hugging Face/Wikimedia are used)
        if: ${{ vars.IMAGEENGINE == 'local' && startsWith(inputs.format, 'stockreel') }}
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu \
            && pip install diffusers transformers accelerate \
            || echo "::warning::The local image model could not be installed; AI/Wikimedia photos are used instead"

      - uses: actions/setup-node@v4
        if: ${{ inputs.format != 'upload' && inputs.format != 'ytauth' && !startsWith(inputs.format, 'stockreel') && inputs.format != 'cinematic' }}
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            shorts/explainer/package-lock.json
            shorts/director/package-lock.json

      - name: Install the animation renderer (Playwright + headless Chromium)
        if: ${{ inputs.format != 'upload' && inputs.format != 'ytauth' && !startsWith(inputs.format, 'director') && !startsWith(inputs.format, 'stockreel') && inputs.format != 'cinematic' }}
        working-directory: shorts/explainer
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: Install the director engine (Three.js + fonts + Playwright + headless Chromium; also draws the thumbnails)
        if: ${{ inputs.format != 'upload' && inputs.format != 'ytauth' && inputs.format != 'voicelab' && !startsWith(inputs.format, 'stockreel') && inputs.format != 'cinematic' }}
        working-directory: shorts/director
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: Voice lab - generate voice samples from several free engines
        if: ${{ inputs.format == 'voicelab' }}
        run: |
          pip install -q edge-tts gTTS
          python shorts/voicelab_more.py videos/voicelab_more

      - name: YouTube sign-in helper (creates the refresh token from the client id and secret)
        if: ${{ inputs.format == 'ytauth' }}
        env:
          IN_CODE: ${{ inputs.auth_code }}
        run: |
          if [ -z "$IN_CODE" ]; then python -m shorts.ytauth url; else python -m shorts.ytauth exchange "$IN_CODE"; fi

      - name: Upload a saved day to YouTube (dry run = only check the credentials)
        if: ${{ inputs.format == 'upload' }}
        env:
          IN_DATE: ${{ inputs.upload_date }}
          IN_LANGS: ${{ matrix.langs }}
          IN_DRY_RUN: ${{ inputs.dry_run }}
        run: |
          # dry_run = only check the credentials; a date = upload that saved day; neither = upload what waits in videos/unpublished/
          if [ "$IN_DRY_RUN" = "true" ]; then python -m shorts.upload_saved --check
          elif [ -z "$IN_DATE" ]; then python -m shorts.pending flush --langs "$IN_LANGS" || true
          else python -m shorts.upload_saved --date "$IN_DATE" --langs "$IN_LANGS"; fi

      - name: Read the manifest sent by Claude (director)
        if: ${{ startsWith(inputs.format, 'director') }}
        env:
          IN_MANIFEST: ${{ inputs.manifest_json }}
          IN_FORMAT: ${{ inputs.format }}
        run: |
          if [ -n "$IN_MANIFEST" ]; then
            printf '%s' "$IN_MANIFEST" > "$RUNNER_TEMP/manifest.json"
          else
            echo "::warning::No manifest_json given, using the example manifest"
            if [ "$IN_FORMAT" = "director-documentary" ]; then EX=gps_documentary; else EX=ai_agents_short; fi
            cp "shorts/director/examples/$EX.json" "$RUNNER_TEMP/manifest.json"
          fi
          python -m shorts.director.run --manifest-file "$RUNNER_TEMP/manifest.json" --langs "${{ matrix.langs }}" --validate-only

      - name: Read the plan sent by Claude
        if: ${{ inputs.format != 'voicelab' && inputs.format != 'upload' && inputs.format != 'ytauth' && !startsWith(inputs.format, 'director') }}
        env:
          IN_PLAN: ${{ inputs.plan_json }}
          IN_FORMAT: ${{ inputs.format || 'shorts' }}
        run: |
          if [ "$IN_FORMAT" = "documentary" ] || [ "$IN_FORMAT" = "stockreel-documentary" ]; then SAMPLE=shorts/sample_documentary_plan.json; CHECK=validate-doc; else SAMPLE=shorts/sample_plan.json; CHECK=validate; fi
          if [ -n "$IN_PLAN" ]; then
            printf '%s' "$IN_PLAN" > "$RUNNER_TEMP/plan.json"
          else
            echo "::warning::No plan_json given, using $SAMPLE"
            cp "$SAMPLE" "$RUNNER_TEMP/plan.json"
          fi
          python -m shorts.plan "$CHECK" "$RUNNER_TEMP/plan.json" || echo "::warning::Plan has warnings (see above)"

      - name: Render and publish (director, Three.js)
        if: ${{ startsWith(inputs.format, 'director') }}
        env:
          IN_LANGS: ${{ matrix.langs }}
          IN_DRY_RUN: ${{ inputs.dry_run }}
          IN_KEEP: ${{ inputs.keep_in_repo }}
        run: |
          ARGS=(--manifest-file "$RUNNER_TEMP/manifest.json" --langs "$IN_LANGS" --no-history)
          if [ "$IN_DRY_RUN" = "true" ]; then ARGS+=(--dry-run); fi
          if [ "$IN_KEEP" = "true" ]; then ARGS+=(--keep-in-repo); fi
          python -m shorts.director.run "${ARGS[@]}"

      - name: Render and publish
        if: ${{ inputs.format != 'voicelab' && inputs.format != 'upload' && inputs.format != 'ytauth' && !startsWith(inputs.format, 'director') }}
        env:
          IN_LANGS: ${{ matrix.langs }}
          IN_DRY_RUN: ${{ inputs.dry_run }}
          IN_FORMAT: ${{ inputs.format || 'shorts' }}
          IN_KEEP: ${{ inputs.keep_in_repo }}
        run: |
          ARGS=(--plan-file "$RUNNER_TEMP/plan.json" --langs "$IN_LANGS")
          if [ "$IN_DRY_RUN" = "true" ]; then ARGS+=(--dry-run); fi
          if [ "$IN_FORMAT" = "cinematic" ]; then
            # never uploads (no --dry-run flag: it has no publish step to skip) - renders and saves only
            python -m shorts.cinematic --plan-file "$RUNNER_TEMP/plan.json" --langs "$IN_LANGS" --out output_cinematic
          elif [ "$IN_FORMAT" = "documentary" ]; then
            if [ "$IN_KEEP" = "true" ]; then ARGS+=(--keep-in-repo); fi
            python -m shorts.documentary "${ARGS[@]}"
          elif [ "$IN_FORMAT" = "stockreel-documentary" ]; then
            if [ "$IN_KEEP" = "true" ]; then ARGS+=(--keep-in-repo); fi
            python -m shorts.stockreel.run "${ARGS[@]}" --documentary
          elif [ "$IN_FORMAT" = "stockreel" ]; then
            python -m shorts.stockreel.run "${ARGS[@]}"
          else
            python -m shorts.main "${ARGS[@]}"
          fi

      - name: Keep videos as a workflow artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: videos-${{ github.run_number }}-${{ strategy.job-index }}
          path: |
            output/*.mp4
            output/*.jpg
            output/plan.json
            output_documentary/*.mp4
            output_documentary/*.jpg
            output_documentary/*_youtube.txt
            output_documentary/plan.json
            output_stockreel/*.mp4
            output_stockreel/*.jpg
            output_stockreel/*_youtube.txt
            output_stockreel/plan.json
            output_stockreel/result.json
            output_director/*.mp4
            output_director/*_youtube.txt
            output_director/manifest.json
            output_director/result.json
            output_director/*/render-report.json
            output_director/*/captions.srt
            output_director/*/thumbnail.jpg
            output_director/*/contact-sheet.png
            output_cinematic/*.mp4
            output_cinematic/*.jpg
            output_cinematic/*.srt
            output_cinematic/*_youtube.txt
            output_cinematic/*_render-report.json
            output_cinematic/plan.json
          retention-days: 14
          if-no-files-found: ignore

      - name: Save topic history and videos
        if: always()
        run: |
          # (old videos are removed by flush-queue.yml, never here: two jobs deleting the same files made the push conflict)
          if [ -n "$(git status --porcelain data/ videos/)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/ videos/
            git commit -m "chore: save today's videos [skip ci]"
            # other runs push to main too (the documentary renders for hours): retry instead of failing on a race
            for i in 1 2 3 4 5 6; do
              git pull --rebase -q && git push && break
              echo "push attempt $i failed, retrying"; git rebase --abort 2>/dev/null || true; sleep $((i * 7))
            done
            git status -sb | head -1
          fi

  # director videos: one history entry for all languages, written after the per-language jobs finish
  history:
    needs: make-shorts
    if: ${{ always() && startsWith(inputs.format, 'director') && !inputs.dry_run && needs.make-shorts.result != 'cancelled' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: shorts/requirements.txt
      - run: pip install -r shorts/requirements.txt
      - uses: actions/download-artifact@v4
        with:
          pattern: videos-${{ github.run_number }}-*
          path: results
      - name: Write the topic history
        run: |
          python -m shorts.director.run history results
          if [ -n "$(git status --porcelain data/)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/
            git commit -m "chore: save director history [skip ci]"
            for i in 1 2 3 4 5 6; do
              git pull --rebase -q && git push && break
              echo "push attempt $i failed, retrying"; git rebase --abort 2>/dev/null || true; sleep $((i * 7))
            done
          fi
