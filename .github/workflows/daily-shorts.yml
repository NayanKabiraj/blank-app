name: Daily YouTube Shorts

on:
  schedule:
    # 03:17 UTC = 08:47 IST, every day
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Render only, do not upload"
        type: boolean
        default: false
      niche:
        description: "Force a niche (leave empty to let Claude research one)"
        type: string
        default: ""
      langs:
        description: "Languages to produce"
        type: string
        default: "en,hi"

permissions:
  contents: write   # to commit data/history.json (topic memory)

concurrency:
  group: daily-shorts
  cancel-in-progress: false

jobs:
  make-shorts:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
      YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
      YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
      YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
      YT_REFRESH_TOKEN_HI: ${{ secrets.YT_REFRESH_TOKEN_HI }}
      # Optional repository variables (Settings > Secrets and variables > Actions > Variables)
      YT_PRIVACY: ${{ vars.YT_PRIVACY || 'public' }}
      NICHE_HINT: ${{ vars.NICHE_HINT }}
      CLAUDE_MODEL: ${{ vars.CLAUDE_MODEL || 'claude-opus-5-5' }}
      PIPER_VOICE_EN: ${{ vars.PIPER_VOICE_EN || 'en_US-lessac-medium' }}
      PIPER_VOICE_HI: ${{ vars.PIPER_VOICE_HI || 'hi_IN-pratham-medium' }}
      VOICES_DIR: ${{ github.workspace }}/.cache/voices
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: shorts/requirements.txt

      - name: Install FFmpeg and fonts (English + Devanagari)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q ffmpeg fonts-noto-core fonts-noto-ui-core
          fc-list | grep -i -E "NotoSans(Devanagari)?-" | head -5

      - name: Cache Piper voices
        uses: actions/cache@v4
        with:
          path: .cache/voices
          key: piper-${{ env.PIPER_VOICE_EN }}-${{ env.PIPER_VOICE_HI }}

      - name: Install Python packages
        run: pip install -r shorts/requirements.txt

      - name: Research, render and publish
        env:
          IN_LANGS: ${{ inputs.langs || 'en,hi' }}
          IN_DRY_RUN: ${{ inputs.dry_run }}
          IN_NICHE: ${{ inputs.niche }}
        run: |
          ARGS=(--langs "$IN_LANGS")
          if [ "$IN_DRY_RUN" = "true" ]; then ARGS+=(--dry-run); fi
          if [ -n "$IN_NICHE" ]; then ARGS+=(--niche "$IN_NICHE"); fi
          python -m shorts.main "${ARGS[@]}"

      - name: Keep videos as a workflow artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shorts-${{ github.run_number }}
          path: |
            output/*.mp4
            output/plan.json
          retention-days: 14
          if-no-files-found: ignore

      - name: Save topic history
        if: always()
        run: |
          if [ -n "$(git status --porcelain data/)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/history.json
            git commit -m "chore: log today's Shorts [skip ci]"
            git push
          fi
