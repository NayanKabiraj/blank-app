name: Probe free AI video providers (temporary)
on:
  push:
    branches: [claude/youtube-shorts-github-actions-k9a6q5]
    paths: [.github/workflows/probe-ai-video.yml]
permissions: {contents: read}
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -q gradio_client requests
      - name: Pollinations model catalog (no key needed)
        run: |
          python - <<'PY'
          import requests, json
          for path in ("video/models", "image/models"):
              try:
                  r = requests.get(f"https://gen.pollinations.ai/{path}", timeout=30)
                  print("==", path, r.status_code)
                  data = r.json()
                  items = data if isinstance(data, list) else data.get("data", data)
                  for m in items:
                      if isinstance(m, dict):
                          keep = {k: m.get(k) for k in ("name","id","paid_only","pricing","min_duration","max_duration","allowed_durations","default_duration","resolutions","aspect_ratios") if k in m}
                          print(json.dumps(keep)[:400])
                      else:
                          print(m)
              except Exception as e:
                  print("ERR", path, e)
          r = requests.get("https://gen.pollinations.ai/image/a%20red%20apple?width=512&height=512", timeout=90)
          print("== anonymous image request:", r.status_code, r.headers.get("content-type"), len(r.content), r.text[:200] if r.status_code != 200 else "")
          PY
      - name: Hugging Face Spaces (status + API)
        run: |
          python - <<'PY'
          import requests
          from gradio_client import Client
          spaces = ["Lightricks/ltx-video-distilled", "Lightricks/LTX-Video-Playground",
                    "zerogpu-aoti/wan2-2-fp8da-aoti-faster", "multimodalart/wan2-1-fast",
                    "Lightricks/LTX-2", "Wan-AI/Wan-2.2-5B", "alexnasa/ltx-2-TURBO"]
          for s in spaces:
              try:
                  info = requests.get(f"https://huggingface.co/api/spaces/{s}", timeout=30).json()
                  print("==", s, "stage:", info.get("runtime", {}).get("stage"), "hw:", info.get("runtime", {}).get("hardware"), "license:", info.get("cardData", {}).get("license"))
              except Exception as e:
                  print("==", s, "info ERR", e); continue
              try:
                  c = Client(s, verbose=False)
                  print(c.view_api(print_info=False, return_format="str")[:2500])
              except Exception as e:
                  print("   client ERR", type(e).__name__, str(e)[:200])
          PY
