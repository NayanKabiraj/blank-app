<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  /* Poppins (SIL Open Font License), bundled so the render needs no network */
  @font-face { font-family: Poppins; font-weight: 700; src: url(fonts/poppins-latin-700.woff2) format('woff2');
    unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+2000-206F, U+2074, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }
  @font-face { font-family: Poppins; font-weight: 700; src: url(fonts/poppins-devanagari-700.woff2) format('woff2');
    unicode-range: U+0900-097F, U+1CD0-1CF9, U+200C-200D, U+20A8, U+20B9, U+20F0, U+25CC, U+A830-A839, U+A8E0-A8FF; }
  @font-face { font-family: Poppins; font-weight: 600; src: url(fonts/poppins-latin-600.woff2) format('woff2');
    unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+2000-206F, U+2074, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }
  @font-face { font-family: Poppins; font-weight: 600; src: url(fonts/poppins-devanagari-600.woff2) format('woff2');
    unicode-range: U+0900-097F, U+1CD0-1CF9, U+200C-200D, U+20A8, U+20B9, U+20F0, U+25CC, U+A830-A839, U+A8E0-A8FF; }
  html, body { margin: 0; padding: 0; width: 1080px; height: 1920px; overflow: hidden; background: #0b1524; }
  #cv { position: absolute; inset: 0; width: 1080px; height: 1920px; }
  #ui { position: absolute; inset: 0; pointer-events: none; font-family: Poppins, "Noto Sans", "Noto Sans Devanagari", sans-serif; }
  .hl { position: absolute; left: 70px; width: 940px; top: 350px; text-align: center; color: #f5f1e6; font-weight: 700;
        line-height: 1.14; letter-spacing: -0.01em; display: none; }
  .hl .w { display: inline-block; white-space: pre; }
  #ui.land .hl { left: 90px; width: 760px; text-align: left; }
  #ui.land .sub { left: 90px; width: 760px; text-align: left; font-size: 42px; }
  .sub { position: absolute; left: 90px; width: 900px; text-align: center; color: #9fb4d0; font-weight: 600; font-size: 46px;
         line-height: 1.2; display: none; }
</style>
</head>
<body>
<canvas id="cv" width="1080" height="1920"></canvas>
<div id="ui"></div>
<script type="module" src="./scene.js"></script>
</body>
</html>
