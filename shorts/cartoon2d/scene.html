<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; padding: 0; width: 1080px; height: 1920px; overflow: hidden; background: #f4ead6; }
  body { font-family: "Noto Sans", "Noto Sans Devanagari", sans-serif; color: #3b2a20; }
  #cv { position: absolute; inset: 0; width: 1080px; height: 1920px; }
  #ui { position: absolute; inset: 0; pointer-events: none; }
  .pill { position: absolute; top: 70px; left: 50%; transform: translateX(-50%);
          padding: 10px 32px; border: 5px solid #3b2a20; border-radius: 40px; background: #fff8e8;
          box-shadow: 0 6px 0 rgba(59,42,32,0.35); font-weight: 900; font-size: 32px; letter-spacing: 2px; white-space: nowrap; }
  .card { position: absolute; left: 64px; right: 64px; top: 350px; padding: 26px 34px 30px; text-align: center;
          background: #fff8e8; border: 6px solid #3b2a20; border-radius: 34px;
          box-shadow: 0 12px 0 rgba(59,42,32,0.28); transform-origin: 50% 100%; }
  .head { font-weight: 900; font-size: 84px; line-height: 1.1; }
  .cap { margin-top: 14px; font-weight: 700; font-size: 44px; color: #6e5646; line-height: 1.22; }
  .big { font-weight: 900; font-size: 170px; line-height: 1; }
  .unit { font-weight: 900; font-size: 62px; margin-top: 2px; }
  .steps { display: flex; flex-direction: column; gap: 10px; margin: 18px auto 0; width: fit-content; text-align: left; }
  .step { font-weight: 800; font-size: 44px; padding: 4px 18px; border-radius: 18px; color: #9a8676; border: 4px solid transparent; }
  .step b { display: inline-block; width: 50px; height: 50px; line-height: 48px; margin-right: 14px; text-align: center;
            border-radius: 50%; font-size: 30px; vertical-align: 6px; color: #fff; background: #b9a796; }
  .step.on { color: #3b2a20; border-color: #3b2a20; }
  .step.done { color: #3b2a20; opacity: 0.6; }
  .cmp { display: flex; justify-content: center; gap: 34px; margin-top: 18px; }
  .cmp div { font-weight: 900; font-size: 46px; padding: 8px 26px; border-radius: 22px; color: #fff; border: 5px solid #3b2a20; }
  .bar { position: absolute; left: 60px; right: 60px; bottom: 60px; height: 22px; border: 4px solid #3b2a20;
         border-radius: 14px; overflow: hidden; background: #fff8e8; }
  .bar i { display: block; height: 100%; }
</style>
</head>
<body>
<canvas id="cv" width="1080" height="1920"></canvas>
<div id="ui"><div class="pill" id="pill"></div><div id="cards"></div><div class="bar"><i id="fill"></i></div></div>
<script type="module" src="./scene.js"></script>
</body>
</html>
