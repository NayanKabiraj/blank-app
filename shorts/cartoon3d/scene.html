<!doctype html>
<html>
<head>
<meta charset="utf-8">
<script type="importmap">{"imports": {"three": "./vendor/three.module.min.js"}}</script>
<style>
  html, body { margin: 0; padding: 0; width: 1080px; height: 1920px; overflow: hidden; }
  body { font-family: "Noto Sans", "Noto Sans Devanagari", sans-serif; }
  #sky { position: absolute; inset: 0; }
  #gl { position: absolute; inset: 0; width: 1080px !important; height: 1920px !important; }
  #ui { position: absolute; inset: 0; pointer-events: none; }
  .pill { position: absolute; top: 70px; left: 50%; transform: translateX(-50%);
          padding: 12px 34px; border-radius: 40px; background: #fff; border: 6px solid #1d1b2f;
          box-shadow: 0 8px 0 #1d1b2f; font-weight: 900; font-size: 34px; letter-spacing: 2px;
          color: #1d1b2f; white-space: nowrap; }
  .card { position: absolute; left: 70px; right: 70px; top: 400px; padding: 34px 40px;
          border-radius: 46px; background: #fff; border: 8px solid #1d1b2f;
          box-shadow: 0 16px 0 #1d1b2f; text-align: center; color: #1d1b2f;
          transform-origin: 50% 100%; }
  .card .head { font-weight: 900; font-size: 92px; line-height: 1.08; }
  .card .cap { margin-top: 16px; font-weight: 700; font-size: 46px; color: #5b5876; line-height: 1.2; }
  .card .big { font-weight: 900; font-size: 170px; line-height: 1; }
  .card .unit { font-weight: 900; font-size: 64px; margin-top: 4px; }
  .steps { display: flex; flex-direction: column; gap: 18px; margin-top: 22px; }
  .step { border: 6px solid #1d1b2f; border-radius: 28px; padding: 16px 22px; font-weight: 800;
          font-size: 46px; background: #f3f1ff; }
  .step.on { color: #fff; box-shadow: 0 8px 0 #1d1b2f; }
  .cmp { display: flex; justify-content: space-between; gap: 24px; margin-top: 22px; }
  .cmp div { flex: 1; border: 6px solid #1d1b2f; border-radius: 28px; padding: 16px 12px;
             font-weight: 800; font-size: 48px; }
  .bar { position: absolute; left: 60px; right: 60px; bottom: 60px; height: 26px; border-radius: 20px;
         background: rgba(255,255,255,0.55); border: 5px solid #1d1b2f; overflow: hidden; }
  .bar i { display: block; height: 100%; background: #ff7a59; }
</style>
</head>
<body>
<div id="sky"></div>
<canvas id="gl" width="1080" height="1920"></canvas>
<div id="ui"><div class="pill" id="pill"></div><div id="cards"></div><div class="bar"><i id="fill"></i></div></div>
<script type="module" src="./scene.js"></script>
</body>
</html>
