<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; padding: 0; width: 1080px; height: 1920px; overflow: hidden; background: #fbfaf5; }
  body { font-family: "Noto Sans", "Noto Sans Devanagari", sans-serif; color: #1b1b1b; }
  #cv { position: absolute; inset: 0; width: 1080px; height: 1920px; }
  #ui { position: absolute; inset: 0; pointer-events: none; }
  .pill { position: absolute; top: 70px; left: 50%; transform: translateX(-50%) rotate(-1.5deg);
          padding: 10px 30px; border: 5px solid #1b1b1b; border-radius: 16px 22px 18px 24px;
          background: #fff; font-weight: 900; font-size: 32px; letter-spacing: 2px; white-space: nowrap; }
  .card { position: absolute; left: 60px; right: 60px; top: 350px; text-align: center; transform-origin: 50% 0; }
  .head { display: inline; font-weight: 900; font-size: 92px; line-height: 1.12;
          background-repeat: no-repeat; background-position: 0 88%; padding: 0 10px;
          box-decoration-break: clone; -webkit-box-decoration-break: clone; }
  .cap { margin-top: 22px; font-weight: 700; font-size: 48px; color: #4a4a4a; line-height: 1.22; }
  .big { font-weight: 900; font-size: 190px; line-height: 1; }
  .unit { font-weight: 900; font-size: 66px; margin-top: 2px; }
  .steps { display: flex; flex-direction: column; gap: 10px; margin: 26px auto 0; width: fit-content; text-align: left; }
  .step { font-weight: 800; font-size: 46px; padding: 2px 14px; border-radius: 10px; color: #8a8a8a; }
  .step b { display: inline-block; width: 52px; height: 52px; line-height: 50px; margin-right: 14px; text-align: center;
            border: 4px solid currentColor; border-radius: 50%; font-size: 30px; vertical-align: 6px; }
  .step.on { color: #1b1b1b; }
  .step.done { color: #1b1b1b; opacity: 0.55; }
  .cmp { display: flex; justify-content: center; gap: 60px; margin-top: 26px; }
  .cmp div { font-weight: 900; font-size: 50px; padding-bottom: 6px; border-bottom: 9px solid; }
  .bar { position: absolute; left: 60px; right: 60px; bottom: 60px; height: 20px; border: 4px solid #1b1b1b;
         border-radius: 12px; overflow: hidden; background: #fff; }
  .bar i { display: block; height: 100%; }
</style>
</head>
<body>
<canvas id="cv" width="1080" height="1920"></canvas>
<div id="ui"><div class="pill" id="pill"></div><div id="cards"></div><div class="bar"><i id="fill"></i></div></div>
<script type="module" src="./scene.js"></script>
</body>
</html>
