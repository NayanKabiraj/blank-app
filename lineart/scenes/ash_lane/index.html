<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Ash Lane</title>
<style>
  html, body { margin: 0; height: 100%; background: #ebe8e2; }
  body { display: grid; place-items: center; }
  .card { height: min(96vh, calc(92vw * 16 / 9)); aspect-ratio: 9 / 16; border-radius: 16px; overflow: hidden; background: #111; box-shadow: 0 18px 50px -18px rgba(40,34,26,.35); }
  body.capture { background: #000; display: block; }
  body.capture .card { width: 100vw; height: 100vh; aspect-ratio: auto; border-radius: 0; box-shadow: none; }
  #stage, #stage svg { display: block; width: 100%; height: 100%; }
  #stage svg .pp { fill: var(--paper, #fdfdfc); }
</style></head>
<body><div class="card"><div id="stage"></div></div>
<script>if (new URLSearchParams(location.search).has('capture')) document.body.classList.add('capture');</script>
<script type="module" src="./story.ts"></script></body></html>
